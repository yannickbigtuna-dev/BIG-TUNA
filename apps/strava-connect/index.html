<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Connect Strava · BIG TUNA</title>
<link rel="stylesheet" href="/styles/tokens.css">
<script>
  /* An invitation secret may arrive only in the URL fragment. Remove it before
     the page can create links, analytics, or browser history entries. */
  (() => {
    const params = new URLSearchParams(location.hash.slice(1));
    window.__challengeInviteToken = params.get('token') || '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  })();
</script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: max(var(--space-4), env(safe-area-inset-top)) var(--space-4) max(var(--space-4), env(safe-area-inset-bottom)); }
  .connect-card { width: min(100%, 540px); padding: clamp(var(--space-5), 6vw, var(--space-8)); }
  .eyebrow { font-size: var(--text-xs); font-weight: var(--weight-black); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-dim); }
  .matchup { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin: var(--space-5) 0 var(--space-6); font-family: var(--font-mono); font-size: clamp(var(--text-xl), 6vw, var(--text-2xl)); font-weight: var(--weight-black); }
  .person { display: inline-flex; align-items: center; gap: var(--space-2); }
  .dot { width: 13px; height: 13px; border-radius: var(--radius-full); background: var(--person-color); box-shadow: 0 0 0 4px color-mix(in srgb, var(--person-color) 18%, transparent); }
  .vs { color: var(--text-dim); font-size: var(--text-sm); letter-spacing: var(--tracking-label); }
  .connect-card h1 { font-size: clamp(var(--text-xl), 7vw, var(--text-3xl)); margin-bottom: var(--space-3); }
  .lead { color: var(--text-muted); margin-bottom: var(--space-5); }
  .notice { padding: var(--space-4); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-muted); font-size: var(--text-sm); }
  .notice strong { color: var(--text); }
  .notice ul { margin: var(--space-2) 0 0 var(--space-5); }
  .connect-btn { width: 100%; min-height: 48px; margin-top: var(--space-5); font-size: var(--text-base); }
  .state-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: var(--radius-full); margin-bottom: var(--space-4); color: var(--accent); font-family: var(--font-mono); font-weight: var(--weight-black); }
  .state-error .state-icon { color: var(--danger); }
  .loading-line { display: flex; align-items: center; gap: var(--space-2); color: var(--text-muted); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: var(--radius-full); animation: spin .8s linear infinite; }
  .privacy { margin-top: var(--space-5); font-size: var(--text-xs); color: var(--text-dim); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<main class="card connect-card" id="connect-root" aria-live="polite" aria-busy="true">
  <div class="eyebrow">Yannick vs Emma · Strava Challenge</div>
  <div class="matchup" aria-label="Yannick versus Emma"><span class="person" style="--person-color:var(--c-red)"><i class="dot"></i>Yannick</span><span class="vs">VS</span><span class="person" style="--person-color:var(--c-blue)"><i class="dot"></i>Emma</span></div>
  <div class="loading-line"><span class="spinner" aria-hidden="true"></span><span>Validating your secure connection link…</span></div>
</main>
<script>
(() => {
  const root = document.getElementById('connect-root');
  const token = window.__challengeInviteToken || '';
  /* Delete the only JavaScript reference as soon as the one prepare request is queued. */
  window.__challengeInviteToken = undefined;
  const escapeHtml = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  function renderError(title, message) {
    root.setAttribute('aria-busy', 'false');
    root.innerHTML = `<section class="state-error"><div class="state-icon" aria-hidden="true">!</div><h1>${escapeHtml(title)}</h1><p class="lead">${escapeHtml(message)}</p><p class="privacy">Request a new connection email from the challenge administrator if you still need to connect.</p></section>`;
    root.querySelector('h1').focus({ preventScroll: true });
  }
  function renderReady(data) {
    const participantId = String(data.participantId || data.participant || '').toLowerCase();
    if (participantId !== 'yannick' && participantId !== 'emma' || typeof data.authorizationUrl !== 'string' || !data.authorizationUrl.startsWith('https://')) {
      renderError('This link cannot be used', 'Ask the challenge administrator for a fresh connection email.');
      return;
    }
    const name = participantId === 'yannick' ? 'Yannick' : 'Emma';
    const color = participantId === 'yannick' ? 'var(--c-red)' : 'var(--c-blue)';
    root.setAttribute('aria-busy', 'false');
    root.innerHTML = `<section><div class="state-icon" style="color:${color}" aria-hidden="true">↗</div><h1>Connect ${name}'s Strava</h1><p class="lead">You will approve access in Strava. This secure link is assigned to ${name}; it cannot connect the other participant.</p><div class="notice"><strong>What the challenge collects</strong><ul><li>Activity types, names, start times, distances, and durations.</li><li>Those details are used for challenge scoring, the public challenge display, and season history.</li><li>You can revoke access anytime in your Strava settings, or contact the challenge administrator to disconnect your account.</li></ul></div><a class="btn btn-primary connect-btn" id="strava-authorize" href="${escapeHtml(data.authorizationUrl)}" rel="noreferrer">Connect with Strava</a><p class="privacy">Never enter your Strava password here or copy an access token. The next step opens Strava directly.</p></section>`;
    document.getElementById('strava-authorize').focus({ preventScroll: true });
  }
  if (!token) { renderError('Connection link missing', 'This secure link is incomplete or has already been removed.'); return; }
  fetch('/api/strava-challenge/oauth/prepare', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ inviteToken: token }), credentials: 'same-origin', referrerPolicy: 'no-referrer'
  }).then(async response => {
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = response.status >= 500 && response.status <= 599
        ? 'Strava connection is temporarily unavailable. Please contact the challenge administrator and try again later.'
        : String(data.code || '').toLowerCase() === 'missing_scope'
          ? 'The needed Strava activity permission was not granted. Request a new connection link and approve activity access.'
          : 'This connection link is invalid, expired, revoked, or has already been used.';
      throw new Error(message);
    }
    renderReady(data);
  }).catch(error => renderError('Connection link unavailable', error.message || 'Please request a new connection email and try again.'));
})();
</script>
</body>
</html>
