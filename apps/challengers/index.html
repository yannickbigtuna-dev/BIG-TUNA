<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CHALLENGERS</title>
  <link rel="stylesheet" href="/styles/tokens.css"><style>
    :root{--accent:var(--c-pink)} body{min-height:100svh;padding-bottom:var(--space-10)} main{width:min(100% - 32px,900px);margin:var(--space-10) auto}.brand{font-size:clamp(2.6rem,10vw,5.6rem);font-weight:var(--weight-black);letter-spacing:-.075em;line-height:.85}.subtitle{font-size:var(--text-lg);color:var(--text-muted);margin:var(--space-3) 0 var(--space-10)}.toolbar,.actions{display:flex;gap:var(--space-3);flex-wrap:wrap}.challenge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:var(--space-4);margin-top:var(--space-5)}.challenge{width:100%;text-align:left;color:var(--text)}.challenge h2{font-size:var(--text-xl);margin:var(--space-2) 0}.muted,.status{color:var(--text-muted)}.status{min-height:1.5em;margin:var(--space-4) 0}.detail[hidden],dialog[hidden]{display:none}.score-list{list-style:none;margin:var(--space-5) 0;display:grid;gap:var(--space-2)}.score-list li{display:flex;justify-content:space-between;padding:var(--space-3);background:var(--surface-2);border-radius:var(--radius-sm)}dialog{margin:auto;width:min(100% - 32px,480px);background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius-lg);color:var(--text);padding:var(--space-6)}dialog::backdrop{background:color-mix(in srgb,var(--bg) 82%,transparent)}form{display:grid;gap:var(--space-3)}label{display:grid;gap:var(--space-1);color:var(--text-muted);font-size:var(--text-sm)}.share-url{word-break:break-all;font-family:var(--font-mono);font-size:var(--text-sm)}.qr{display:block;max-width:200px;width:100%;height:auto;background:white;padding:var(--space-2);border-radius:var(--radius-sm);margin-top:var(--space-3)}@media(max-width:520px){main{width:min(100% - 24px,900px);margin-top:var(--space-6)}.toolbar .btn{flex:1}.actions .btn{width:100%}}
  </style>
  <meta name="referrer" content="no-referrer"><script>window.AuthOptions={brand:{title:"CHALLENGERS",subtitle:"Train together."}};</script><script src="/topbar.js"></script><script src="/auth.js"></script>
</head><body><main><h1 class="brand">CHALLENGERS</h1><p class="subtitle">Train together.</p><div class="toolbar"><button class="btn btn-primary" id="new-challenge" type="button">New challenge</button><button class="btn btn-ghost" id="open-inbox" type="button">Review inbox</button><button class="btn btn-ghost" id="open-settings" type="button">Settings</button><button class="btn btn-ghost" id="refresh" type="button">Refresh</button></div><p class="status" id="status" aria-live="polite"></p><section id="list" class="challenge-grid" aria-label="Your challenges"></section><section class="card detail" id="detail" hidden></section></main>
<dialog id="new-dialog"><form id="new-form"><h2>Create a challenge</h2><label>Challenge name<input class="field" name="name" required maxlength="120" autocomplete="off"></label><label>Invite by username (optional)<input class="field" name="participantUsername" autocomplete="off"></label><label>Format<select class="field" name="template" id="form-template"><option value="weekly">Weekly</option><option value="season">Season</option><option value="distance">Distance</option><option value="streak">Streak</option><option value="custom">Custom</option></select></label><label>Scoring<select class="field" name="scoringMode" id="form-scoring"><option value="count">Activity count</option><option value="distance">Distance</option><option value="duration">Time</option><option value="streak">Streak</option></select></label><label>Cadence<select class="field" name="cadenceType" id="form-cadence"><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="season">Season</option></select></label><fieldset id="sports-rules"><legend>Sports that count</legend><div id="sports-list"></div><button type="button" class="btn btn-ghost" id="add-sport">Add sport</button></fieldset><label class="checkbox-label"><input type="checkbox" name="manualReview" id="form-review" checked> Allow manual review</label><p id="create-status" class="status" aria-live="polite"></p><div class="actions"><button class="btn btn-primary">Create</button><button class="btn btn-ghost" type="button" data-close>Cancel</button></div></form></dialog>
<dialog id="share-dialog"><section><h2 id="share-title">Invite people</h2><p class="status">Anyone with this link or code can preview the challenge. They must choose to join after signing in.</p><p id="share-url" class="share-url"></p><p id="share-code" class="share-code" hidden></p><img id="share-qr" class="qr" alt="Invitation QR code" hidden><div class="actions"><button id="generate-link" class="btn btn-primary" type="button">Generate invite link</button><button id="copy-link" class="btn btn-primary" type="button" hidden>Copy link</button><button id="copy-code" class="btn btn-ghost" type="button" hidden>Copy code</button><a id="native-open" class="btn btn-ghost" hidden>Open in app</a><button id="revoke-link" class="btn btn-ghost" type="button">Revoke invitation</button><button class="btn btn-ghost" type="button" data-close>Close</button></div><p id="share-status" class="status" aria-live="polite"></p></section></dialog>
<dialog id="settings-dialog"><section><h2>Account Settings</h2><p id="settings-account-name" class="status"></p><p id="settings-strava-status" class="status"></p><div class="actions"><button id="settings-strava-btn" class="btn btn-primary" type="button"></button><button id="settings-inbox-btn" class="btn btn-ghost" type="button">Review inbox</button><button id="settings-signout-btn" class="btn btn-ghost" type="button" style="color:var(--danger)">Sign out</button><button class="btn btn-ghost" type="button" data-close>Close</button></div><p id="settings-status" class="status" aria-live="polite"></p></section></dialog>
<dialog id="inbox-dialog"><section><h2>Review inbox</h2><p class="status" id="inbox-empty" hidden>No reviews waiting.</p><div id="inbox-list" class="score-list"></div><div class="actions"><button class="btn btn-ghost" type="button" data-close>Close</button></div></section></dialog>
<script src="/challengers/challengers.js"></script></body></html>
