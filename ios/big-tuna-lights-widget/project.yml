name: BigTunaLights
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    MARKETING_VERSION: 1.1.2
    CURRENT_PROJECT_VERSION: 4
    CODE_SIGN_STYLE: Automatic
targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BigTunaLights
      - path: Shared
        excludes:
          - IPhoneWatchConnectivity.swift
      - path: Assets.xcassets
    entitlements:
      path: BigTunaLights/BigTunaLights.entitlements
    dependencies:
      - target: AppWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yannickmorgans.bigtuna.lights
        PRODUCT_NAME: BIG TUNA Lights
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BIG TUNA Lights
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AppWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BigTunaLightsWidget
      - path: Shared
        excludes:
          - IPhoneWatchConnectivity.swift
    entitlements:
      path: BigTunaLightsWidget/BigTunaLightsWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yannickmorgans.bigtuna.lights.widget
        PRODUCT_NAME: BIG TUNA Lights Widgets
        INFOPLIST_FILE: BigTunaLightsWidget/Info.plist
        SKIP_INSTALL: YES
