name: YannickLights
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: 6
    CODE_SIGN_STYLE: Automatic
targets:
  YannickLights:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BigTunaLights
      - path: Shared
      - path: Assets.xcassets
    entitlements:
      path: BigTunaLights/BigTunaLights.entitlements
    dependencies:
      - target: YannickLightsWidgets
        embed: true
      - target: YannickLightsWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yannickmorgans.bigtuna.lights
        PRODUCT_NAME: Yannick Lights
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yannick Lights
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  YannickLightsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BigTunaLightsWidget
      - path: Shared
        excludes:
          - IPhoneWatchConnectivity.swift
          - LightsAppIntents.swift
          - YannickLightsShortcuts.swift
    entitlements:
      path: BigTunaLightsWidget/BigTunaLightsWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yannickmorgans.bigtuna.lights.widget
        PRODUCT_NAME: Yannick Lights Widgets
        INFOPLIST_FILE: BigTunaLightsWidget/Info.plist
        SKIP_INSTALL: YES
  YannickLightsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: BigTunaLightsWatch
      - path: Assets.xcassets
    entitlements:
      path: BigTunaLightsWatch/BigTunaLightsWatch.entitlements
    dependencies:
      - target: YannickLightsWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yannickmorgans.bigtuna.lights.watchapp
        PRODUCT_NAME: Yannick Lights Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yannick Lights
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ca.yannickmorgans.bigtuna.lights
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLSchemes:
              - bigtunalights
  YannickLightsWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: BigTunaLightsWatchWidget
      - path: BigTunaLightsWatch/Shared
    entitlements:
      path: BigTunaLightsWatchWidget/BigTunaLightsWatchWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yannickmorgans.bigtuna.lights.watchapp.widget
        PRODUCT_NAME: Yannick Lights Watch Widgets
        INFOPLIST_FILE: BigTunaLightsWatchWidget/Info.plist
        SKIP_INSTALL: YES
  YannickLightsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: YannickLightsTests
    dependencies:
      - target: YannickLights
